name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch supersedes any run still in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of requires-python (>=3.12,<3.14).
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, so a
        # dependency change that was never locked cannot pass CI.
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Runs ruff, ruff-format and mypy through the same pinned hook versions
      # developers get locally, so CI and a local commit cannot disagree.
      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
