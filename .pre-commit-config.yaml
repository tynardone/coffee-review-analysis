# Files the hooks must never rewrite.
#
# `trailing-whitespace` and `end-of-file-fixer` operate line-by-line with no
# idea what the file means. Run against a CSV whose quoted fields contain
# newlines — which every scraped review does — they edit the DATA: an
# `--all-files` run silently stripped a trailing space from inside a
# blind_assessment value in the parsed reviews CSV. The saved review
# pages under tests/fixtures/ are golden-test inputs and equally must not be
# touched, or the parse they pin stops matching what the site actually served.
# curated/ holds hand-kept CSVs under the same hazard as data/.
exclude: |
  (?x)^(
    data/.*|
    curated/.*|
    tests/fixtures/.*
  )$

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
        # Notebooks are JSON that Jupyter rewrites on every save, with no final
        # newline and with cell source held as string literals. Letting the
        # whitespace fixers near them means both perpetual churn and the same
        # edit-the-contents hazard as the CSVs above.
    -   id: end-of-file-fixer
        exclude: \.ipynb$
    -   id: trailing-whitespace
        exclude: \.ipynb$
-   repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    # Strip outputs and execution counts from notebooks on commit. Embedded
    # chart images once took the notebooks past 13 MB each, and every re-run
    # stored a fresh copy in history; clearing outputs by hand was not enough.
    -   id: nbstripout
# ruff and mypy run from the project's own environment, at the versions locked
# in uv.lock, rather than from copies pre-commit installs on its own. A copy
# would drift from the venv's version, and mypy's would see none of the
# installed packages, so every pandas, httpx and pydantic type would be Any.
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        # Notebooks included: their code cells are held to the same style as
        # the package, and only the cells you actually edit will move.
    -   id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
    -   id: mypy
        name: mypy
        # Checks `files` from pyproject.toml as a whole, since a change in one
        # module can break the types of another.
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
