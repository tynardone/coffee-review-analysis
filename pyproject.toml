[build-system]
# 77 is the first release to read the PEP 639 `license` expression below.
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee"
version = "1.0.0"
description = "Project for web scraping and analysis of data from Coffeereview.com"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Tyler Nardone", email = "tynardone@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "lxml>=5.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pycountry>=24.6",
    "pydantic-settings>=2.10",
    "rapidfuzz>=3.14.5",
    "tqdm>=4.67",
    "unidecode>=1.3",
]

[project.scripts]
refresh-data = "coffee.cli:refresh_data"
scrape-reviews = "coffee.cli:scrape_reviews"
parse-reviews = "coffee.cli:parse_reviews"
clean-reviews = "coffee.cli:clean_reviews_command"
fetch-exchange-rates = "coffee.cli:fetch_exchange_rates"
fetch-cpi = "coffee.cli:fetch_cpi_command"
resolve-roasters = "coffee.cli:resolve_roasters"

[project.urls]
Repository = "https://github.com/tynardone/coffee-review-analysis"

# PEP 735 dependency groups, managed by uv.
# `analysis` holds the notebook / modeling stack; `dev` holds tooling.
# Both are installed by default via [tool.uv] default-groups below.
[dependency-groups]
analysis = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.9",
    "nltk>=3.8",
    # numba/llvmlite are pulled in transitively by umap-learn; pin a modern
    # floor so the resolver doesn't fall back to versions that lack 3.12 wheels.
    "numba>=0.61",
    "plotly>=5.23",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "spacy>=3.7",
    "umap-learn>=0.5",
    "wordcloud>=1.9",
]
# The pre-commit hooks for ruff and mypy run these locked versions through
# `uv run`, so the hooks, CI and your editor all use the same tools.
dev = [
    "mypy>=2.3",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.16.8",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.setuptools]
# src layout: the package is importable only once installed (`uv sync` installs
# it editable), so tests, notebooks and the CLI all import the same `coffee`,
# never a copy that happens to sit in the working directory.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
# Discovered rather than listed, so a new subpackage cannot be left out of the
# build by forgetting to name it here.
where = ["src"]

[tool.setuptools.package-data]
# Ship the inline type information (PEP 561) so importers get the annotations.
coffee = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is on the path so tests share helpers as `tests.paths`;
# importlib mode lets test files in different folders share a basename.
pythonpath = ["."]
# -q keeps the golden-parse diff readable when a fixture's parse changes.
addopts = "-q --import-mode=importlib --strict-markers"
markers = [
    "network: hits a real site or API; excluded from CI",
    "slow: full replays or large data",
]

[tool.mypy]
files = ["src", "tests"]
# The package is held to --strict. Tests are not: see the override below.
strict = true
plugins = ["pydantic.mypy"]
# Module names come from paths relative to these roots: src/coffee/x.py is
# `coffee.x` and tests/paths.py is `tests.paths`, matching how both import.
mypy_path = ["src", "."]
explicit_package_bases = true
# pandas, bs4, lxml and pycountry ship without full type information.
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
untyped_calls_exclude = ["pycountry"]

[[tool.mypy.overrides]]
# Test functions and their fakes go unannotated; annotating every
# `def test_...() -> None` and every stand-in client adds noise, not safety.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
# Overrides replace the global list, so import-untyped is repeated here.
disable_error_code = ["import-untyped", "annotation-unchecked"]

[tool.ruff]
lint.select = [
    "I", # isort
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "N", # pep8-naming
    "UP", # pyupgrade: syntax for the supported Python versions
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie
    "PTH", # pathlib over os.path
    "LOG", # logging misuse, such as calls on the root logger
    "RUF", # ruff's own rules, such as an unsorted __all__
]
lint.ignore = ["E402"]
# Fakes in tests use class-level state on purpose, and the normalizer tests
# feed in the typographic apostrophes the site really uses.
lint.per-file-ignores."tests/**" = ["RUF001", "RUF012", "RUF024"]
lint.isort.known-first-party = ["coffee", "tests"]
line-length = 88
# The package sits under src/, where import sorting would not look for it by
# default, and would file `coffee` with the third-party imports.
src = ["src", "."]
