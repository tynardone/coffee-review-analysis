[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee"
version = "1.0.0"
description = "Project for web scraping and analysis of data from Coffeereview.com"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Tyler Nardone", email = "tynardone@gmail.com" }]
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pycountry>=24.6",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.32",
    "tqdm>=4.67",
    "unidecode>=1.3",
]

[project.scripts]
refresh-data = "coffee.cli:refresh_data"
scrape-reviews = "coffee.cli:scrape_reviews"
clean-reviews = "coffee.cli:clean_reviews_command"
fetch-exchange-rates = "coffee.cli:fetch_exchange_rates"
fetch-cpi = "coffee.cli:fetch_cpi_command"
resolve-roasters = "coffee.cli:resolve_roasters"

[project.urls]
Repository = "https://github.com/tynardone/coffee-review-analysis"

# PEP 735 dependency groups, managed by uv.
# `analysis` holds the notebook / modelling stack; `dev` holds tooling.
# Both are installed by default via [tool.uv] default-groups below.
[dependency-groups]
analysis = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.9",
    "nltk>=3.8",
    # numba/llvmlite are pulled in transitively by umap-learn; pin a modern
    # floor so the resolver doesn't fall back to versions that lack 3.12 wheels.
    "numba>=0.61",
    "plotly>=5.23",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "spacy>=3.7",
    "umap-learn>=0.5",
    "wordcloud>=1.9",
]
# Floors track the versions pinned in .pre-commit-config.yaml. When the hook
# and the local venv disagree, each reformats what the other just formatted.
dev = [
    "mypy>=2.3",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "ruff>=0.16.8",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.setuptools]
# Flat layout: only the `coffee` package ships; notebooks/ and tests/ do not.
packages = ["coffee", "coffee.roasters"]

[tool.setuptools.package-data]
# Ship the inline type information (PEP 561) so importers get the annotations.
coffee = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the golden-parse diff readable when a fixture's parse changes.
addopts = "-q"

[tool.mypy]
disable_error_code = "import-untyped"
exclude = "venv/"
ignore_missing_imports = true


[tool.ruff]
lint.select = [
    "I", # isort
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
    "B", # flake8-bugbear
    "N", # pep8-naming
]
lint.ignore = ["E402"]
line-length = 88
